<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COLIGO — Suivi de colis</title>
<link rel="manifest" href="manifest-client.json">
<meta name="theme-color" content="#1D6FA8">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<script src="js/pwa-register.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: {
        coligo: {
          DEFAULT: '#1D6FA8', dark: '#14537E', light: '#E8F2F9',
          deep: '#0C3F65', bright: '#368AC8'
        }
      },
      fontFamily: {
        sans: ['Inter', 'Segoe UI', 'system-ui', 'sans-serif'],
        display: ['Archivo', 'Segoe UI', 'system-ui', 'sans-serif']
      }
    } }
  }
</script>
<link rel="icon" type="image/png" href="assets/favicon-coligo.png">
<link rel="stylesheet" href="css/theme.css">
<style>
  /* Espace client : le texte repose directement sur la photo de fond,
     sans plaque blanche derrière. On passe donc en texte clair avec une
     ombre portée sombre, pour rester lisible sur un fond flouté/assombri. */
  .client-page .on-photo {
    color: #ffffff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65), 0 1px 0 rgba(0, 0, 0, 0.5);
  }
  .client-page .on-photo-sub {
    color: rgba(255, 255, 255, 0.88);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
  }
  .client-page .brand-name { color: #ffffff; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6); }
  .client-page .brand-sub { color: rgba(255, 255, 255, 0.82); text-shadow: 0 1px 6px rgba(0, 0, 0, 0.55); }

  /* Le client ne peut pas imprimer le reçu : l'impression du navigateur
     (menu Fichier > Imprimer) ne produit qu'une page d'avertissement. */
  .print-only { display: none; }
  @media print {
    body > *:not(.print-only) { display: none !important; }
    .print-only { display: block !important; font: 14px/1.5 Arial, sans-serif; color: #000; padding: 40px; text-align: center; }
    body { background: #fff !important; }
    body::before, body::after { display: none !important; background: none !important; }
  }
</style>
</head>
<body class="app-bg client-page font-sans text-slate-800 min-h-screen">
<div class="print-only">L'impression n'est pas disponible depuis le suivi en ligne COLIGO.<br>Le reçu officiel vous est remis au guichet de l'agence.</div>

<header class="px-4 lg:px-8 py-4">
  <img src="assets/logo-coligo-blanc.png" alt="COLIGO" class="brand-img brand-img-lg" style="filter: drop-shadow(0 2px 8px rgba(0,0,0,0.55));">
</header>

<main class="px-4 lg:px-8 pb-16 max-w-3xl mx-auto">

  <section class="text-center my-8 lg:my-12">
    <h1 class="text-3xl lg:text-5xl font-bold mb-4 on-photo tracking-tight">Où en est votre colis&nbsp;?</h1>
    <p class="max-w-lg mx-auto on-photo-sub">
      Entrez votre numéro de suivi pour connaître le statut de votre colis, en temps réel.
    </p>
  </section>

  <div class="bg-white rounded-2xl border border-slate-200 shadow-[0_2px_4px_rgba(12,63,101,0.06),0_8px_20px_-12px_rgba(12,63,101,0.22)] p-5 lg:p-6 mb-6">
    <label class="block text-sm text-slate-600 mb-2" for="numero-input">Numéro de suivi</label>
    <div class="flex flex-col sm:flex-row gap-3">
      <input id="numero-input" type="text" autocomplete="off"
        class="flex-1 px-4 py-3 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-coligo">
      <button id="btn-search"
        class="bg-coligo hover:bg-coligo-dark text-white font-semibold px-7 py-3 rounded-xl transition whitespace-nowrap">
        Rechercher
      </button>
    </div>
    <div id="error-zone" class="mt-3"></div>
  </div>

  <!-- Fenêtre de résultat : statut + reçu. Elle ne se ferme que manuellement. -->
  <div id="suivi-modal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-start sm:items-center justify-center p-3 sm:p-6" role="dialog" aria-modal="true" aria-labelledby="suivi-modal-titre">
    <div class="bg-slate-50 rounded-2xl w-full max-w-3xl max-h-[92vh] flex flex-col shadow-2xl">
      <div class="flex items-center justify-between gap-3 px-5 py-4 bg-white border-b border-slate-200 rounded-t-2xl">
        <h2 id="suivi-modal-titre" class="font-bold text-coligo-deep">Suivi de votre colis</h2>
        <button type="button" id="suivi-modal-x" class="text-2xl leading-none text-slate-500 hover:text-slate-800 px-2" aria-label="Fermer">&times;</button>
      </div>
      <div id="suivi-modal-corps" class="overflow-y-auto p-4 sm:p-5">
        <div id="modal-info" class="mb-3"></div>
        <div id="result-zone"></div>
      </div>
      <div class="flex justify-end px-5 py-4 bg-white border-t border-slate-200 rounded-b-2xl">
        <button type="button" id="suivi-modal-fermer" class="bg-coligo hover:bg-coligo-dark text-white font-semibold px-7 py-2.5 rounded-xl transition">Fermer</button>
      </div>
    </div>
  </div>

  <p class="text-center text-xs mt-12 on-photo-sub">
    COLIGO · suivi de colis en temps réel
  </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/ui-helpers.js"></script>
<script src="js/receipt.js"></script>
<script src="js/config.js"></script>
<script src="js/client.js"></script>
</body>
</html>
